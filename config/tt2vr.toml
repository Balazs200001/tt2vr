# tt2vr configuration. Deployed next to tt2vr.dll in <game>\tt2vr\.
# Every key is shown with its default value. Unknown keys and bad values are reported in the log
# (tt2vr\logs\tt2vr.log) and the default is used instead.

[log]
# Log verbosity: "trace", "debug", "info", "warn" or "error".
level = "info"
# Log per-frame details (very chatty; leave off unless debugging a specific frame).
verbose_frames = false
# Log fps and frame times (average and worst) every N seconds, so performance can be read after a headset session.
# 0 = off.
perf_interval_s = 10

[hotkeys]
# Hotkeys only fire while the game window has focus, and the keys are NOT blocked from the game.
# Format: "F11", "Ctrl+F11", "Ctrl+Shift+F12", "Alt+P", "Insert", "PageUp", "Num0", "A".."Z", "0".."9", "F1".."F24".
# Modifiers must match exactly (Shift+F11 does not trigger a plain F11 hotkey). "none" disables a hotkey.
# Show or hide the debug overlay.
overlay = "F10"
# Write a frame trace (tt2vr\captures\frametrace_<frame>.txt) of the next presented frame.
frame_trace = "F11"
# Dump the textures written by the next presented frame (one snapshot per pass) into the capture folder.
texture_dump = "Shift+F11"
# Trigger a RenderDoc capture of the next frame (needs RenderDoc attached).
renderdoc_capture = "F9"
# Show or hide a mouse cursor drawn by the overlay (the game hides the Windows cursor while riding).
cursor = "F8"
# Recenter the headset view: your current head position and heading become the rider's eye point.
recenter = "F7"

[overlay]
# Show the debug overlay at startup.
visible = true
# Draw the overlay's mouse cursor at startup (toggle with the cursor hotkey).
show_cursor = false

[camera]
# Move the helmet mesh with the camera override (overlay sliders now, head tracking later). Off = the helmet stays
# where the game puts it. Also switchable in the overlay. The game's "Helmet No Mesh" view has no helmet either way.
helmet_follows_view = true
# While head-tracked, remove the game's automatic look into corners ("Dynamic View" / look to apex) and the
# controller look from the view, so only your head turns it. Visual only; the game's option itself is untouched
# (setting it to Off in the game menu does the same).
remove_auto_look = true

[xr]
# Start OpenXR (headset) when a runtime and a connected headset are available. Off = the game stays flat.
enabled = true
# Eye image size = the runtime's recommended size times this (0.25..2.0). The game renders at this size too
# (force_render_size below), so lowering it is the main performance knob.
resolution_scale = 1.0
# While the headset session runs, present the desktop window without VSync; the headset paces the frames instead.
desktop_vsync_off = true
# Show the game on the desktop window while the headset session runs. The game renders each frame once either way
# (the window shows the same image the headset gets), so this only saves the desktop present. false = the window
# freezes on its last image while the headset is in use; it updates again when the session stops.
desktop_mirror = true
# In menus, the pause screen, loading screens and movies, show the flat game on a virtual screen that stays fixed in
# the room (no head tracking, so the menu's camera cuts only happen on the screen). false = head-track menus too.
menu_screen = true
# Distance of that screen in front of your recentered head (metres, 0.5..10) and its width (metres, 0.25..10).
# The height follows the game window's aspect ratio. 2.4 m wide at 2 m is about a 62 degree wide view.
screen_distance = 2.0
screen_width = 2.4
# Render the game at the eye image size while the headset is connected, whatever the window size (the desktop window
# shows it stretched). Keep the game in Borderless or Windowed mode. false = render at the window size (stretched
# into the headset).
force_render_size = true
# Render both eyes every frame, as the engine's two split-screen views side by side (the game then renders at twice
# the eye width; the desktop window shows both eyes). false = left eye only, right eye black (Phase 3 mode).
stereo = true
# What the desktop window shows while the headset session runs (the game renders at the headset's size, which the
# window would show stretched): "left" = left eye, "both" = both eyes side by side, never stretched; "game" = the
# raw rendered image, stretched.
desktop_view = "left"
# true: the desktop image covers the whole window (cropped at the edges, no black bars); false: the whole image fits
# inside the window (black bars).
desktop_fill = true
# Shadow maps are created at this multiple of the size the game's shadow quality setting asks for (1..4, 1 = off).
# The headset's wide view makes each shadow cascade cover twice the area, so 2 gives the flat game's shadow detail;
# the distant shadow map is split per eye in VR, so 2 gives each eye the full size. Follows the in-game shadow
# quality option and never changes your saved settings. Cascades are capped at 4096. Costs VRAM and GPU time.
shadow_scale = 2
# Screen-space ambient occlusion while the headset session runs. It only sees what is on screen, so in the wide eye
# views it stretches and moves with your head; false = off in VR (your in-game setting is kept for flat play and is
# never changed).
ssao = false
# Motion blur while the headset session runs. At VR frame rates the game's camera motion blur smears the bike and
# rider heavily; false = off in VR (your in-game setting is kept for flat play and is never changed). TAA stays on.
motion_blur = false
# Both eyes use one set of cascaded (sun) shadow maps per frame, fitted from the centre of your head to the view of
# both eyes, instead of rendering them again for the right eye. Saves GPU time and keeps the shadow edges identical
# in both eyes. false = each eye renders its own (read at game start).
shared_shadows = true

[capture]
# Folder for frame traces and texture dumps; relative to <game>\tt2vr\ unless absolute.
dir = "captures"
# Folder for RenderDoc captures; empty = same as dir. E.g. "C:/dev/tt2vr-re/rdc" to keep captures with the RE material.
renderdoc_dir = ""
# Maximum number of textures written per texture dump request (1..1024).
max_textures = 64
# Include depth buffers in texture dumps.
include_depth = true
# Floats of each constant buffer update recorded in a frame trace (0..1024).
cb_floats = 16

[commands]
# Accept command files dropped into <game>\tt2vr\commands\ (lets tools trigger captures without a hotkey).
enabled = true
# Check the commands folder every N presented frames (1..600).
poll_frames = 10

[debug]
# [debug] Pretend TT2.exe has this SHA-256 (64 hex characters) to test the unknown-version path. Empty = real hash.
fake_exe_sha256 = ""
# [debug] Log every foreground-window change and, once per second, each XInput pad's sticks/triggers/buttons and
# whether the game window has focus (to diagnose lost steering input). Read-only; off by default.
input_log = false
