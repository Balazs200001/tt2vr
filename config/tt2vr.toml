# tt2vr configuration. Deployed next to tt2vr.dll in <game>\tt2vr\.
# Every key is shown with its default value. Unknown keys and bad values are reported in the log
# (tt2vr\logs\tt2vr.log) and the default is used instead.

[log]
# Log verbosity: "trace", "debug", "info", "warn" or "error".
level = "info"
# Log per-frame details (very chatty; leave off unless debugging a specific frame).
verbose_frames = false
# Log fps and frame times (average and worst) every N seconds, so performance can be read after a headset session.
# 0 = off.
perf_interval_s = 10

[hotkeys]
# Hotkeys only fire while the game window has focus, and the keys are NOT blocked from the game.
# Format: "F11", "Ctrl+F11", "Ctrl+Shift+F12", "Alt+P", "Insert", "PageUp", "Num0", "A".."Z", "0".."9", "F1".."F24".
# Modifiers must match exactly (Shift+F11 does not trigger a plain F11 hotkey). "none" disables a hotkey.
# Show or hide the debug overlay.
overlay = "F10"
# Write a frame trace (tt2vr\captures\frametrace_<frame>.txt) of the next presented frame.
frame_trace = "F11"
# Dump the textures written by the next presented frame (one snapshot per pass) into the capture folder.
texture_dump = "Shift+F11"
# Trigger a RenderDoc capture of the next frame (needs RenderDoc attached).
renderdoc_capture = "F9"
# Show or hide a mouse cursor drawn by the overlay (the game hides the Windows cursor while riding).
cursor = "F8"
# Recenter the headset view: your current head position and heading become the rider's eye point.
recenter = "F7"
# Seated calibration: move the rider's eye point relative to your head by 1 cm per press, forward / back / up / down,
# and back to the recentered point. The numpad keys need NumLock on. The offset is saved in tt2vr\user.toml and
# survives recenters and restarts ([camera] seat_forward / seat_up / seat_right).
seat_forward = "Num8"
seat_back = "Num2"
seat_up = "Num9"
seat_down = "Num3"
seat_reset = "Num5"

[overlay]
# Show the debug overlay at startup.
visible = true
# Draw the overlay's mouse cursor at startup (toggle with the cursor hotkey).
show_cursor = false
# Add a "VR" tab to the game's Options > Display page with the settings that can change while the game runs (horizon
# lock, camera shake, world and IPD scale, seat position, HUD distance and height). Changes there are saved to
# tt2vr\user.toml. Read at game start.
options_tab = true

[camera]
# Move the helmet mesh with the camera override (overlay sliders now, head tracking later). Off = the helmet stays
# where the game puts it. Also switchable in the overlay. The game's "Helmet No Mesh" view has no helmet either way.
helmet_follows_view = true
# While head-tracked, remove the game's automatic look into corners ("Dynamic View" / look to apex) and the
# controller look from the view, so only your head turns it. Visual only; the game's option itself is untouched
# (setting it to Off in the game menu does the same).
remove_auto_look = true
# While head-tracked, how much of the game camera's roll against the horizon is removed, in percent (0..100). The
# game tilts its riding camera into corners and with speed noise, and the fork view rolls with the bike; your own
# head roll is never removed. 100 = the horizon stays level, 0 = the game's roll. Also in the overlay (Comfort).
horizon_lock = 100
# While the headset session runs, how much of the game's camera shake is kept, in percent (0..100): the speed noise
# (a vertical bob and roll that grow with speed) and the shake after a collision. 100 = the game's, 0 = none. Your
# own head movement is never touched; the game's values come back when the session stops. Also in the overlay.
shake = 100
# Where the rider's eyes sit relative to your recentered head, in metres in the bike's directions (-0.5..0.5):
# forward (+) / back (-), up (+) / down (-), right (+) / left (-). The seat hotkeys change it while riding.
seat_forward = 0.0
seat_up = 0.0
seat_right = 0.0

[xr]
# Start OpenXR (headset) when a runtime and a connected headset are available. Off = the game stays flat.
enabled = true
# Eye image size = the runtime's recommended size times this (0.25..2.0). The game renders at this size too
# (force_render_size below), so lowering it is the main performance knob.
resolution_scale = 1.0
# The game renders each eye at this fraction of the eye image size (0.5..1.0) and AMD FidelityFX Super Resolution 1
# (FSR1) upscales and sharpens it to the full size: costs less GPU time than a lower resolution_scale for a sharper
# image. 1.0 = off (no upscaling). Also in Options > Display > VR ("Render scale (FSR)"); a change there resizes the
# game's render targets once, 0.75 s after the last step.
render_scale = 1.0
# FSR1 sharpening (0..2): 0 = strongest, 2 = mild. Only used while render_scale is below 1. The VR tab shows it as
# "FSR sharpening" 0..100% (100% = 0 here, 90% = 0.2).
fsr_sharpness = 0.2
# While the headset session runs, present the desktop window without VSync; the headset paces the frames instead.
desktop_vsync_off = true
# Show the game on the desktop window while the headset session runs. The game renders each frame once either way
# (the window shows the same image the headset gets), so this only saves the desktop present. false = the window
# freezes on its last image while the headset is in use; it updates again when the session stops.
desktop_mirror = true
# In menus, the pause screen, loading screens and movies, show the flat game on a virtual screen that stays fixed in
# the room (no head tracking, so the menu's camera cuts only happen on the screen). false = head-track menus too.
menu_screen = true
# Distance of that screen in front of your recentered head (metres, 0.5..10) and its width (metres, 0.25..10).
# The height follows the game window's aspect ratio. 2.4 m wide at 2 m is about a 62 degree wide view.
screen_distance = 2.0
screen_width = 2.4
# Render the game at the eye image size while the headset is connected, whatever the window size (the desktop window
# shows it stretched). Keep the game in Borderless or Windowed mode. false = render at the window size (stretched
# into the headset).
force_render_size = true
# Render both eyes every frame, as the engine's two split-screen views side by side (the game then renders at twice
# the eye width; the desktop window shows both eyes). false = left eye only, right eye black (Phase 3 mode).
stereo = true
# What the desktop window shows while the headset session runs (the game renders at the headset's size, which the
# window would show stretched): "left" = left eye, "both" = both eyes side by side, never stretched; "game" = the
# raw rendered image, stretched.
desktop_view = "left"
# true: the desktop image covers the whole window (cropped at the edges, no black bars); false: the whole image fits
# inside the window (black bars).
desktop_fill = true
# Shadow maps are created at this multiple of the size the game's shadow quality setting asks for (1..4, 1 = off).
# The headset's wide view makes each shadow cascade cover twice the area, so 2 gives the flat game's shadow detail
# and 1.5 most of it for less GPU time; the distant shadow map is split per eye in VR and uses the next power of two
# (2 for 1.5). Follows the in-game shadow quality option and never changes your saved settings. Cascades are capped
# at 4096. Costs VRAM and GPU time. Read at game start.
shadow_scale = 1.5
# Screen-space ambient occlusion while the headset session runs. It only sees what is on screen, so in the wide eye
# views it stretches and moves with your head; false = off in VR (your in-game setting is kept for flat play and is
# never changed).
ssao = false
# Motion blur while the headset session runs. At VR frame rates the game's camera motion blur smears the bike and
# rider heavily; false = off in VR (your in-game setting is kept for flat play and is never changed). TAA stays on.
motion_blur = false
# FXAA while the headset session runs. The game's "TAA" option runs FXAA and then TAA; in VR TAA alone is sharper
# and costs less. false = FXAA off in VR (your in-game setting is kept for flat play and is never changed).
fxaa = false
# The game's vignette (darker screen edges, stronger with speed) while the headset session runs. The headset's lenses
# darken the edges anyway; false = off in VR (your in-game setting is kept for flat play).
vignette = false
# Both eyes use one set of cascaded (sun) shadow maps per frame, fitted from the centre of your head to the view of
# both eyes, instead of rendering them again for the right eye. Saves GPU time and keeps the shadow edges identical
# in both eyes. false = each eye renders its own (read at game start).
shared_shadows = true
# World scale (0.5..2): above 1 the world looks larger and you smaller (your head movement and eye separation count
# for less in the game world), below 1 the opposite. 1 = real scale.
world_scale = 1.0
# Eye separation multiplier (0.5..2) on top of the world scale: above 1 everything looks smaller and closer in depth,
# below 1 flatter. 1 = your headset's IPD.
ipd_scale = 1.0
# Rain drops on the helmet visor: both eyes show the same drops. false = each eye simulates its own drops (the
# right eye's then get no streaks from the bike's speed).
visor_drops_shared = true
# The game's occlusion culling (it skips objects hidden behind invisible boxes inside the terrain) while the headset
# session runs. false = everything in view is drawn: a test for brief flashes of distant landscape through nearby
# scenery; costs more draw calls. Also in Options > Display > VR ("Occlusion culling"), saved to user.toml.
occlusion = true

[hud]
# While riding in the headset, the game's 2D HUD (map, speed, gear, times, messages) is taken out of the eye images
# and shown on its own flat panel. false = the HUD stays painted into the eye images (spread across both eyes).
enabled = true
# Panel texture width in pixels (512..4096); the height follows the aspect below.
pixels = 1920
# The HUD's layout shape, width / height (1.0..2.4). 1.78 = the game's 16:9 layout; a narrower panel pulls the corner
# gauges toward the middle of your view.
aspect = 1.78
# Vertical spread of the HUD (1.0..2.0): the layout gets this much more height, so the elements at the top and at the
# bottom move apart (up and down from the panel's centre) while keeping their size and their place left to right.
# 1.0 = the game's layout. The panel gets taller by the same factor.
spread = 1.3
# Panel distance in front of your recentered head (metres, 0.3..5), its width (metres, 0.2..4), its centre above (+)
# or below (-) your eye height (metres, -1..1), and how far its top leans away from you (degrees, -60..60).
distance = 1.0
width = 0.9
height = -0.05
tilt = 0.0
# "seat": the panel is fixed to the bike, like a dashboard (look at it by moving your head). "head": it stays in the
# same place in your view whatever you look at.
follow = "seat"
# Also draw the HUD on the desktop window (over the mirrored eye image), so the flat screen still shows it.
desktop = true

[capture]
# Folder for frame traces and texture dumps; relative to <game>\tt2vr\ unless absolute.
dir = "captures"
# Folder for RenderDoc captures; empty = same as dir. E.g. "C:/dev/tt2vr-re/rdc" to keep captures with the RE material.
renderdoc_dir = ""
# Maximum number of textures written per texture dump request (1..1024).
max_textures = 64
# Include depth buffers in texture dumps.
include_depth = true
# Floats of each constant buffer update recorded in a frame trace (0..1024).
cb_floats = 16

[commands]
# Accept command files dropped into <game>\tt2vr\commands\ (lets tools trigger captures without a hotkey).
enabled = true
# Check the commands folder every N presented frames (1..600).
poll_frames = 10

[debug]
# [debug] Pretend TT2.exe has this SHA-256 (64 hex characters) to test the unknown-version path. Empty = real hash.
fake_exe_sha256 = ""
# [debug] Log every foreground-window change and, once per second, each XInput pad's sticks/triggers/buttons and
# whether the game window has focus (to diagnose lost steering input). Read-only; off by default.
input_log = false
# [debug] Watch the rendered eye images for single-frame glitches (a frame unlike both its neighbours while those
# agree, e.g. scenery missing for one frame) while riding in the headset: each one is logged and saved as a strip of
# small images (before, glitch, after) in captures\flashes. About 0.1 ms GPU and 0.3 ms CPU per frame. Off by default.
flash_detect = false
